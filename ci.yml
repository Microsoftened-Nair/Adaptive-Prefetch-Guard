name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - debian-12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            jq

      - name: Show toolchain versions
        run: |
          cc --version
          make --version | head -1

      - name: Release build (with full warnings)
        run: make

      - name: Verify the binary runs
        run: |
          ./apg --help | head -5
          test -x ./apg

      - name: Static analysis pass (warnings as errors)
        run: make analyze

      - name: Debug build (ASan + UBSan)
        run: make debug

      - name: ASan smoke test (5s dry-run)
        # Run the ASan binary for 5 seconds against the first real block
        # device available in the runner. SIGTERM after 5s; ASan will
        # report any leak or memory error on exit.
        run: |
          DEV=$(ls /sys/block | grep -vE 'loop|ram|zram|fd' | head -1)
          if [ -z "$DEV" ]; then
            echo "No suitable block device found for smoke test; skipping"
            exit 0
          fi
          echo "Smoke-testing against /dev/$DEV"
          # Run for ~5 seconds then SIGTERM. We expect exit code 0
          # (graceful shutdown) and no sanitizer output on stderr.
          set +e
          timeout --signal=TERM 5 ./apg --device "$DEV" --dry-run \
              --interval-ms 500 --verbose > /tmp/apg_smoke.log 2>&1
          rc=$?
          set -e
          cat /tmp/apg_smoke.log
          # timeout returns 124 if it had to kill the process; that's OK
          # because our own SIGTERM handler exits 0. Anything else is a fail.
          if [ "$rc" != "0" ] && [ "$rc" != "124" ]; then
            echo "::error::Smoke test exited with code $rc"
            exit 1
          fi
          # Check for sanitizer diagnostics
          if grep -E 'runtime error|AddressSanitizer|ERROR:' /tmp/apg_smoke.log; then
            echo "::error::Sanitizer errors detected"
            exit 1
          fi
          # Verify every emitted log line is valid JSON
          if ! jq -e . /tmp/apg_smoke.log > /dev/null 2>&1 \
             && ! cat /tmp/apg_smoke.log | while read -r line; do \
                  echo "$line" | jq -e . > /dev/null; \
                done; then
            echo "::error::Log output contains invalid JSON"
            exit 1
          fi

      - name: Bash syntax check on eval.sh
        run: |
          bash -n eval.sh
          chmod +x eval.sh

      - name: Validate systemd unit
        run: |
          # systemd-analyze may not be present on all runners; install if needed.
          if ! command -v systemd-analyze >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends systemd
          fi
          # Filter out expected notes about /usr/sbin/apg not being
          # installed in the CI environment.
          systemd-analyze verify apg.service 2>&1 \
            | grep -vE 'Command /usr/sbin/apg is not executable|Command .man apg' \
            || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apg-build-${{ matrix.os }}
          path: |
            ./apg
            /tmp/apg_smoke.log
          retention-days: 7

  yaml-lint:
    name: YAML Lint (config files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install --user yamllint
      - name: Lint YAML files
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 120}, \
            document-start: {present: false}, truthy: {check-keys: false}}}" \
            .github/workflows/ci.yml apg.service || true
